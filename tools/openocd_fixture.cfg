# OpenOCD fixture for IndiH743 pad-test ST-LINK (no NRST).
#
# Stock stm32h7x.cfg overrides must be corrected after source:
#   - reset_config none (no SRST on pogos)
#   - dual-bank 2 MB flash
#   - work-area in AXI SRAM, *not* DTCM (see below)
# Keep SWD modest; the flash wrapper erases/writes one 128 KiB sector at a
# time.

source [find interface/stlink.cfg]
transport select swd
adapter speed 1000
reset_config none

# Flash loader work area.
#
# Upstream stm32h7x.cfg defaults to DTCM:
#     -work-area-phys 0x20000000 -work-area-size 0x10000
# On this fixture every write into that window fails, first via
# `flash write_image`:
#     Error: Failed to write memory at 0x20002194
#     Error: error writing to flash at address 0x08000000 at offset 0x00000000
# and equally for a bare `mww 0x20000000 ...`, so the flash *loader* can never
# be downloaded and sector 0 never gets written, even though the erase (which
# only pokes FLASH_* registers through the APB-AP) succeeds.
#
# AXI SRAM (D1, 0x24000000..0x2407FFFF, 512 KiB) answers normal debug reads
# and writes, so the loader lives there. Keep the size at 64 KiB: it is large
# enough for bulk block writes and leaves the top of AXI SRAM free for the
# stack.
set WORKAREA_PHYS 0x24000000
set WORKAREASIZE 0x10000
set WORKAREA_SIZE $WORKAREASIZE

source [find target/stm32h7x_dual_bank.cfg]

# Re-apply after target script (it sets srst_nogate + 1800 kHz).
reset_config none
adapter speed 1000
stm32h7x.cpu0 cortex_m reset_config sysresetreq

# Move the work area off DTCM (target script already set it to 0x20000000).
if {[catch {
    stm32h7x.cpu0 configure -work-area-phys $WORKAREA_PHYS -work-area-size $WORKAREA_SIZE
} _err]} {
    echo "Warning: could not move work-area to AXI SRAM: $_err"
} else {
    echo "Work-area: AXI SRAM @ [format 0x%08X $WORKAREA_PHYS] ([format 0x%X $WORKAREA_SIZE] bytes)"
}
