# Community-style OpenOCD cfg for STM32H743 + ST-LINK/V2 without NRST.
# Based on recipes used on RPi / WeAct H743 / Hackaday H7 bring-up:
#   - OpenOCD >= 0.12
#   - interface/stlink.cfg + stm32h7x_dual_bank (2 MB H743)
#   - reset_config none (no NRST wire; power-cycle instead)
#   - do NOT use `program` (it always does reset init); use halt + write_image

source [find interface/stlink.cfg]
transport select swd
adapter speed 1000
reset_config none

set WORKAREASIZE 0x10000
source [find target/stm32h7x_dual_bank.cfg]

# Re-apply after target script overrides (srst_nogate / 1800 kHz)
reset_config none
adapter speed 1000
