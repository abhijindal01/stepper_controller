<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In · Stepper Control Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    --bg-base: #090d16;
    --bg-panel: #111827;
    --bg-input: #0b1120;
    --border-subtle: rgba(148, 163, 184, 0.16);
    --border-focus: #3b82f6;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --danger-border: rgba(239, 68, 68, 0.35);
    --danger-text: #fca5a5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.14), transparent 52%),
        var(--bg-base);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
}

.login-shell {
    width: 100%;
    max-width: 410px;
}

.login-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
}

.brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.16);
    border: 1px solid rgba(59, 130, 246, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #60a5fa;
    flex-shrink: 0;
}

.brand-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
}

.brand-sub {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 2px 0 0;
}

.divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 0 0 22px;
}

.field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.input-wrap {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrap input {
    width: 100%;
    padding: 12px 44px 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.input-wrap input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}

.toggle-pw {
    position: absolute;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-pw:hover {
    color: var(--text-primary);
}

.submit-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12.5px 18px;
    border-radius: 10px;
    border: 1px solid rgba(96, 165, 250, 0.25);
    background: var(--accent);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
}

.submit-btn:hover {
    background: var(--accent-hover);
}

.submit-btn:active {
    transform: translateY(1px);
}

.error-banner {
    margin-top: 16px;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-text);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.port-meta {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
</style>
</head>
<body>

<div class="login-shell">
    <div class="login-card">
        <div class="brand-row">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
            <div>
                <h1 class="brand-title">STEPPER CONTROL CONSOLE</h1>
                <p class="brand-sub">Dual-Arduino Raspberry Pi Motion System</p>
            </div>
        </div>

        <div class="divider"></div>

        <form method="POST" autocomplete="current-password">
            <label class="field-label" for="passwordInput">Operator Password</label>
            <div class="input-wrap">
                <input
                    id="passwordInput"
                    type="password"
                    name="password"
                    placeholder="Enter operator password"
                    autofocus
                    required
                >
                <button type="button" class="toggle-pw" onclick="togglePassword()" title="Toggle password visibility" aria-label="Toggle password visibility">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" class="submit-btn">Sign In to Console</button>
        </form>

        {% if error %}
        <div class="error-banner" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="port-meta">
            <span>M1: /dev/stepper_a</span>
            <span>M2: /dev/stepper_b</span>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById("passwordInput");
    input.type = input.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
