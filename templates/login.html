<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In · Stepper Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    --bg-page: #1c222b;
    --bg-header: #181e26;
    --bg-card: #2a313c;
    --bg-input: #232a34;
    --border-line: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --blue-btn: #4374e0;
    --blue-btn-hover: #3664cc;
    --red-soft: rgba(201, 68, 68, 0.18);
    --red-border: rgba(239, 68, 68, 0.4);
    --red-text: #fca5a5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 25%, #232a35 0%, var(--bg-page) 70%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
}

.card {
    width: 100%;
    max-width: 390px;
    background: var(--bg-card);
    border: 1px solid var(--border-line);
    border-radius: 14px;
    padding: 32px 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: var(--text-muted);
}

label {
    display: block;
    font-size: 13.5px;
    color: #d1d5db;
    margin-bottom: 8px;
}

input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input:focus {
    border-color: var(--blue-btn);
    box-shadow: 0 0 0 3px rgba(67, 116, 224, 0.25);
}

button[type="submit"] {
    width: 100%;
    margin-top: 16px;
    padding: 12.5px 18px;
    border-radius: 9px;
    border: none;
    background: var(--blue-btn);
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
}

button[type="submit"]:hover {
    background: var(--blue-btn-hover);
}

.error {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--red-soft);
    border: 1px solid var(--red-border);
    color: var(--red-text);
    font-size: 13.5px;
}
</style>
</head>
<body>

<div class="card">
    <h1>Stepper Controller</h1>
    <p class="subtitle">Enter password to continue</p>

    <form method="POST">
        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            name="password"
            placeholder="Password"
            autofocus
            required
        >
        <button type="submit">Sign In</button>
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}
</div>

</body>
</html>
