<!DOCTYPE html>
<html>

<head>

<title>Login - Stepper Controller</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

body
{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}


.card
{
    background:#1e293b;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 15px black;
    width:300px;
    text-align:center;
}


h2
{
    color:#38bdf8;
    margin-top:0;
}


input
{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
    box-sizing:border-box;
}


button
{
    width:100%;
    padding:15px;
    margin-top:5px;
    border-radius:10px;
    border:none;
    font-size:18px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}


.error
{
    color:#f87171;
    margin-top:15px;
}


</style>

</head>



<body>


<div class="card">

<h2>
STEPPER CONTROLLER
</h2>

<form method="POST">

<input
type="password"
name="password"
placeholder="Password"
autofocus
required>

<button type="submit">
LOGIN
</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>


</body>

</html>
